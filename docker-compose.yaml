  cloud_dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.14}
        RUST_VERSION: ${RUST_VERSION:-1.88}
        PYTHON_DIGEST: ${PYTHON_DIGEST:-sha256:9aaa474097d094040649f2162a627c0049b408f52138d980916788d80f04802f}
        RUST_DIGEST: ${RUST_DIGEST:-sha256:af306cfa71d987911a781c37b59d7d67d934f49684058f96cf72079c3626bfe0}
    container_name: cloud_dashboard
    environment:
      - CLOUD_DASHBOARD_API_KEY_FILE=/run/secrets/cloud_dashboard_api_key.txt
    command: ["python", "-m", "src.cloud_dashboard.cloud_dashboard_api"]
    env_file:
      - .env
    ports:
      - "${PUBLISH_ADDRESS:-127.0.0.1}:${CLOUD_DASHBOARD_PORT:-5006}:5006"
    volumes:
      - ./src:/app/src
      - secrets_cloud_dashboard:/run/secrets:ro
    depends_on:
      secrets_init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - data_net
      - control_net
    pids_limit: 256
    mem_limit: 512m
    restart: unless-stopped
    security_opt:
      - no-new-privileges:${NO_NEW_PRIVILEGES:-true}
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "-H",
          "X-Forwarded-Proto: https",
          "http://localhost:${CLOUD_DASHBOARD_PORT:-5006}/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  config_recommender:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.14}
        RUST_VERSION: ${RUST_VERSION:-1.88}
        PYTHON_DIGEST: ${PYTHON_DIGEST:-sha256:9aaa474097d094040649f2162a627c0049b408f52138d980916788d80f04802f}
        RUST_DIGEST: ${RUST_DIGEST:-sha256:af306cfa71d987911a781c37b59d7d67d934f49684058f96cf72079c3626bfe0}
    container_name: config_recommender
    environment:
      - RECOMMENDER_API_KEY_FILE=/run/secrets/recommender_api_key.txt
    command: ["python", "-m", "src.config_recommender.recommender_api"]
    env_file:
      - .env
    ports:
      - "${PUBLISH_ADDRESS:-127.0.0.1}:8010:8010"
    volumes:
      - ./src:/app/src:ro
      - secrets_recommender:/run/secrets:ro
    depends_on:
      secrets_init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - data_net
      - control_net
    pids_limit: 256
    mem_limit: 512m
    restart: unless-stopped
    security_opt:
      - no-new-privileges:${NO_NEW_PRIVILEGES:-true}
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "-H",
          "X-Forwarded-Proto: https",
          "http://localhost:8010/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  cloud_proxy:
    build:
      context: ./cloud-proxy
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.14}
        PYTHON_DIGEST: ${PYTHON_DIGEST:-sha256:9aaa474097d094040649f2162a627c0049b408f52138d980916788d80f04802f}
    container_name: cloud_proxy
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8008"]
    env_file:
      - .env
    ports:
      - "${PUBLISH_ADDRESS:-127.0.0.1}:${CLOUD_PROXY_PORT:-8008}:8008"
    volumes:
      - ./cloud-proxy:/app:ro
      - ./src:/app/src:ro
    networks:
      - edge_net
      - control_net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:${NO_NEW_PRIVILEGES:-true}
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; req = urllib.request.Request('http://localhost:8008/health', headers={'X-Forwarded-Proto': 'https'}); resp = urllib.request.urlopen(req, timeout=5); raise SystemExit(0 if resp.status == 200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  prompt_router:
    build:
      context: ./prompt-router
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.14}
        PYTHON_DIGEST: ${PYTHON_DIGEST:-sha256:9aaa474097d094040649f2162a627c0049b408f52138d980916788d80f04802f}
    container_name: prompt_router
    command:
      [
        "uvicorn",
        "main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "${PROMPT_ROUTER_PORT:-8009}",
      ]
    env_file:
      - .env
    ports:
      - "${PUBLISH_ADDRESS:-127.0.0.1}:${PROMPT_ROUTER_PORT:-8009}:8009"
    volumes:
      - ./prompt-router:/app:ro
      - ./src:/app/src:ro
    networks:
      - control_net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:${NO_NEW_PRIVILEGES:-true}
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; req = urllib.request.Request('http://localhost:${PROMPT_ROUTER_PORT:-8009}/health', headers={'X-Forwarded-Proto': 'https'}); resp = urllib.request.urlopen(req, timeout=5); raise SystemExit(0 if resp.status == 200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Stages the secret files into a volume the runtime users can read (#1912). The host copies in ./secrets can then stay
  # private (0600 files in a 0700 directory) instead of world-readable: this one-shot job runs as root, which can read them
  # whatever their owner, and writes the container-readable copies where only Docker can reach them.
  secrets_anchor:
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    user: "65532:65532"
    restart: unless-stopped
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    entrypoint: ["sh", "-c"]
    command: ["trap 'exit 0' TERM INT; while :; do sleep 3600; done"]
    volumes:
      - secrets_nginx:/staging/anchor/nginx_proxy:ro
      - secrets_ai_service:/staging/anchor/ai_service:ro
      - secrets_escalation:/staging/anchor/escalation_engine:ro
      - secrets_tarpit:/staging/anchor/tarpit_api:ro
      - secrets_admin_ui:/staging/anchor/admin_ui:ro
      - secrets_captcha:/staging/anchor/captcha_service:ro
      - secrets_cloud_dashboard:/staging/anchor/cloud_dashboard:ro
      - secrets_recommender:/staging/anchor/config_recommender:ro
      - secrets_postgres:/staging/anchor/postgres:ro
      - secrets_redis:/staging/anchor/redis:ro
      - secrets_blocklist_sync:/staging/anchor/blocklist_sync:ro
      - secrets_grafana:/staging/anchor/grafana:ro

  secrets_init:
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    user: "0:0"
    restart: "no"
    network_mode: none
    read_only: true
    depends_on:
      secrets_anchor:
        condition: service_started
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - CHOWN
      - FOWNER
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=0700,size=1m
    volumes:
      - ./secrets:/staging/source:ro
      - secrets_nginx:/staging/target/nginx_proxy
      - secrets_ai_service:/staging/target/ai_service
      - secrets_escalation:/staging/target/escalation_engine
      - secrets_tarpit:/staging/target/tarpit_api
      - secrets_admin_ui:/staging/target/admin_ui
      - secrets_captcha:/staging/target/captcha_service
      - secrets_cloud_dashboard:/staging/target/cloud_dashboard
      - secrets_recommender:/staging/target/config_recommender
      - secrets_postgres:/staging/target/postgres
      - secrets_redis:/staging/target/redis
      - secrets_blocklist_sync:/staging/target/blocklist_sync
      - secrets_grafana:/staging/target/grafana
    entrypoint: ["sh", "-c"]
    # Only the plain *.txt secret files each service needs are staged into per-service tmpfs volumes (mode 0400, per-UID chown);
    # ephemeral internal secrets are generated in RAM (/tmp) if absent on disk. Anything else in ./secrets is ignored.
    command:
      - |
        set -eu
        umask 077
        mkdir -p /tmp/eph
        for f in /staging/source/*.txt; do
          if [ -f "$$f" ]; then cp "$$f" /tmp/eph/; fi
        done
        for name in auth_jwt_secret system_seed captcha_secret escalation_api_key recommender_api_key cloud_dashboard_api_key; do
          if [ ! -s "/tmp/eph/$${name}.txt" ]; then
            head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' > "/tmp/eph/$${name}.txt"
          fi
        done
        stage() {
          svc="$$1"; uid="$$2"; gid="$$3"; shift 3
          dir="/staging/target/$$svc"
          find "$$dir" -mindepth 1 -delete
          chmod 755 "$$dir"
          for fname in "$$@"; do
            if [ -f "/tmp/eph/$$fname" ]; then
              cp "/tmp/eph/$$fname" "$$dir/$$fname"
              chown "$$uid:$$gid" "$$dir/$$fname"
              chmod 400 "$$dir/$$fname"
            fi
          done
        }
        stage nginx_proxy 65534 65534 redis_password.txt
        stage postgres 70 70 pg_password.txt
        stage redis 0 0 redis_password.txt
        stage grafana 472 0 grafana_admin_password.txt
        stage ai_service 1000 1000 pg_password.txt redis_password.txt escalation_api_key.txt
        stage escalation_engine 1000 1000 pg_password.txt redis_password.txt escalation_api_key.txt auth_jwt_secret.txt captcha_secret.txt external_api_key.txt ip_reputation_api_key.txt community_blocklist_api_key.txt smtp_password.txt
        stage tarpit_api 1000 1000 pg_password.txt redis_password.txt system_seed.txt
        stage admin_ui 1000 1000 pg_password.txt redis_password.txt auth_jwt_secret.txt admin_ui_password_hash.txt escalation_api_key.txt
        stage captcha_service 1000 1000 captcha_secret.txt redis_password.txt
        stage cloud_dashboard 1000 1000 pg_password.txt redis_password.txt cloud_dashboard_api_key.txt
        stage config_recommender 1000 1000 redis_password.txt recommender_api_key.txt
        stage blocklist_sync 1000 1000 redis_password.txt
        rm -rf /tmp/eph

  postgres:
    image: postgres:15-alpine@sha256:e18480a22d6e48f4d816a6696769b1ec09ac73a824c5649e49c7d8b684913f3d
    container_name: postgres_markov_db
    depends_on:
      secrets_init:
        condition: service_completed_successfully
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init_markov.sql:/docker-entrypoint-initdb.d/init_markov.sql
      - secrets_postgres:/run/secrets:ro
    environment:
      # The official Postgres image expects the POSTGRES_* variables, but
      # our .env uses the newer PG_* naming. Map them here so both the
      # container and the rest of the stack get the correct values.
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_PASSWORD_FILE=${PG_PASSWORD_FILE}
      - POSTGRES_DB=${PG_DBNAME}
    ports:
      - "${PUBLISH_ADDRESS:-127.0.0.1}:${PG_PORT:-5432}:5432"
    networks:
      - data_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    container_name: redis_store
    # Load the password from the same file used by the other services
    command:
      ["sh", "-c", "redis-server --requirepass $(cat ${REDIS_PASSWORD_FILE})"]
    ports:
      - "${PUBLISH_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    depends_on:
      secrets_init:
        condition: service_completed_successfully
    volumes:
      - redis_data:/data
      - secrets_redis:/run/secrets:ro
    environment:
      - REDIS_PASSWORD_FILE=${REDIS_PASSWORD_FILE}
    networks:
      - data_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $(cat ${REDIS_PASSWORD_FILE}) ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  blocklist_sync:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.14}
        RUST_VERSION: ${RUST_VERSION:-1.88}
        PYTHON_DIGEST: ${PYTHON_DIGEST:-sha256:9aaa474097d094040649f2162a627c0049b408f52138d980916788d80f04802f}
        RUST_DIGEST: ${RUST_DIGEST:-sha256:af306cfa71d987911a781c37b59d7d67d934f49684058f96cf72079c3626bfe0}
    container_name: blocklist_sync
    command: ["python", "-m", "scripts.blocklist_sync_daemon"]
    env_file:
      - .env
    volumes:
      - secrets_blocklist_sync:/run/secrets:ro
    depends_on:
      secrets_init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - edge_net
      - data_net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:${NO_NEW_PRIVILEGES:-true}
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  fail2ban:
    image: crazymax/fail2ban:1.1.0@sha256:a1476ec3587dd7c6756d8cdb448fb0a262c242042d8a71557da6b5aa7aecd911
    container_name: fail2ban
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./fail2ban:/data
      - nginx_logs:/var/log/nginx:ro
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - nginx_proxy

  suricata:
    image: jasonish/suricata:8.0.3@sha256:3f7b2f06e4667e4149deb34c52f278213a4a9b74bf926939aa5cbfc6c595dca0
    container_name: suricata
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./suricata:/etc/suricata:ro
      - suricata_logs:/var/log/suricata
    command:
      ["-c", "/etc/suricata/suricata.yaml", "-i", "${SURICATA_INTERFACE:-eth0}"]
    restart: unless-stopped
    depends_on:
      - nginx_proxy

  # Narrow, read-only view of the Docker API for Traefik. Everything except listing and inspecting containers (plus the
  # defaults: events, ping, version) is refused, and the proxy sits on an internal network with no route out.
  docker_socket_proxy:
    image: tecnativa/docker-socket-proxy:v0.4.1@sha256:3400c429c5f9e1b21d62130fb93b16e2e772d4fb7695bd52fc2b743800b9fe9e
    container_name: docker_socket_proxy
    environment:
      CONTAINERS: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /run
      - /tmp
    networks:
      - docker_api
    restart: unless-stopped

  traefik:
    image: traefik:v3.6.7@sha256:a9890c898f379c1905ee5b28342f6b408dc863f08db2dab20e46c267d1ff463a
    container_name: traefik
    command:
      - --providers.docker=true
      # Container discovery goes through the read-only socket proxy below, never the raw Docker socket.
      - --providers.docker.endpoint=tcp://docker_socket_proxy:2375
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=false
    ports:
      - "${PUBLISH_ADDRESS:-127.0.0.1}:8005:80"
      - "${PUBLISH_ADDRESS:-127.0.0.1}:8081:8080"
    networks:
      - control_net
      - docker_api
    depends_on:
      - docker_socket_proxy
    restart: unless-stopped

  llama3:
    image: ollama/ollama:0.18.0@sha256:e23e6499890325d31f3454cdc83f7a613a2423c8a9e167bbafea0b0e3c27d7c6
    container_name: llama3
    command: ["sh", "-c", "ollama pull llama3 && ollama serve"]
    ports:
      - "${PUBLISH_ADDRESS:-127.0.0.1}:11434:11434"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.llm.rule=PathPrefix(`/`)"
      - "traefik.http.routers.llm.entrypoints=web"
      - "traefik.http.services.llm.loadbalancer.server.port=11434"
      - "traefik.http.services.llm.loadbalancer.weight=2"
    volumes:
      - ./models/shared-data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - control_net
    restart: unless-stopped

  mixtral:
    image: ollama/ollama:0.18.0@sha256:e23e6499890325d31f3454cdc83f7a613a2423c8a9e167bbafea0b0e3c27d7c6
    container_name: mixtral
    command: ["sh", "-c", "ollama pull mixtral && ollama serve"]
    ports:
      - "${PUBLISH_ADDRESS:-127.0.0.1}:11435:11434"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.llm.rule=PathPrefix(`/`)"
      - "traefik.http.routers.llm.entrypoints=web"
      - "traefik.http.services.llm.loadbalancer.server.port=11434"
      - "traefik.http.services.llm.loadbalancer.weight=1"
    volumes:
      - ./models/shared-data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - control_net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.10.0@sha256:4a61322ac1103a0e3aea2a61ef1718422a48fa046441f299d71e660a3bc71ae9
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PUBLISH_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - edge_net
      - data_net
      - control_net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.4.1@sha256:e932bd6ed0e026595b08483cd0141e5103e1ab7ff8604839ff899b8dc54cabcb
    container_name: grafana
    ports:
      - "${PUBLISH_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Read from a generated file so the password is never admin/admin (#1914). Grafana applies it when it first creates
      # its database; an existing grafana_data volume keeps its old password (see docs/monitoring_stack.md to reset it).
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password.txt
      GF_USERS_ALLOW_SIGN_UP: "false"
    # Refuse to start without a real password: if the file were missing or empty Grafana would fall back to admin/admin
    # (Docker also creates a directory when a bind-mount source is missing, which -f rejects).
    entrypoint:
      - /bin/sh
      - -c
      - >-
        if [ ! -f /run/secrets/grafana_admin_password.txt ] || [ ! -s /run/secrets/grafana_admin_password.txt ];
        then echo "Grafana admin password file is missing or empty. Run the secrets generator
        (scripts/linux/generate_secrets.sh, scripts/macos/generate_secrets.zsh or scripts/windows/Generate-Secrets.ps1)
        so secrets/grafana_admin_password.txt exists." >&2; exit 1; fi; exec /run.sh
    volumes:
      - grafana_data:/var/lib/grafana
      - secrets_grafana:/run/secrets:ro
    networks:
      - control_net
    depends_on:
      secrets_init:
        condition: service_completed_successfully
      prometheus:
        condition: service_started
    restart: unless-stopped

  # OPT-IN: not started by default. It needs full control of the Docker socket, so it only runs when you ask for it
  # (`docker compose --profile auto-update up -d`) and only touches containers that carry the label
  # `com.centurylinklabs.watchtower.enable=true`. Images in this file are pinned by digest, so review and bump the
  # digests deliberately; enabling Watchtower on a pinned container means you accept unreviewed updates for it.
  watchtower:
    image: containrrr/watchtower:1.7.1@sha256:6dd50763bbd632a83cb154d5451700530d1e44200b268a4e9488fefdfcf2b038
    container_name: watchtower
    profiles: ["auto-update"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval ${WATCHTOWER_INTERVAL:-86400} --cleanup --label-enable
    networks:
      - control_net
    restart: unless-stopped

networks:
  edge_net:
    driver: bridge
  data_net:
    driver: bridge
    internal: true
  control_net:
    driver: bridge
    internal: true
  docker_api:
    driver: bridge
    internal: true

volumes:
  secrets_nginx:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "mode=0755,size=1m"
  secrets_ai_service:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "mode=0755,size=1m"
  secrets_escalation:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "mode=0755,size=1m"
  secrets_tarpit:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "mode=0755,size=1m"
  secrets_admin_ui:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "mode=0755,size=1m"
  secrets_captcha:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "mode=0755,size=1m"
  secrets_cloud_dashboard:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "mode=0755,size=1m"
  secrets_recommender:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "mode=0755,size=1m"
  secrets_postgres:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "mode=0755,size=1m"
  secrets_redis:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
