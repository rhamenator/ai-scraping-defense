      - AUTH_JWT_SECRET_FILE=/run/secrets/auth_jwt_secret.txt
      - ADMIN_UI_PASSWORD_HASH_FILE=/run/secrets/admin_ui_password_hash.txt
      - ESCALATION_API_KEY_FILE=/run/secrets/escalation_api_key.txt
    ports:
      - "${PUBLISH_ADDRESS:-127.0.0.1}:${ADMIN_UI_PORT:-5002}:5002"
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs
      - secrets_admin_ui:/run/secrets:ro
    depends_on:
      secrets_init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - edge_net
      - data_net
      - control_net
    pids_limit: 256
    mem_limit: 512m
    restart: unless-stopped
    security_opt:
