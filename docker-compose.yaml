# docker-compose.yaml (v4 - Final)
#
# This version combines the clean .env configuration with the robust
# stability settings (healthchecks, cache volumes) from the original file.
# It represents the best of both worlds.

services:
  # Only nginx_proxy (80/443) is the public edge. Every other published port binds to loopback by default; set
  # PUBLISH_ADDRESS (for example to a VPN or private interface address) only on a trusted network. Never publish the
  # data stores, the model servers or the admin surfaces on a public address.
  mailhog:
    image: mailhog/mailhog@sha256:8d76a3d4ffa32a3661311944007a415332c4bb855657f4f6c57996405c009bea
    container_name: mailhog
    ports:
      - "${PUBLISH_ADDRESS:-127.0.0.1}:${ALERT_SMTP_PORT:-1025}:1025"
      - "${PUBLISH_ADDRESS:-127.0.0.1}:${ALERT_SMTP_WEB_PORT:-8025}:8025"
    networks:
      - control_net
    restart: unless-stopped

  mock_external_api:
    image: stoplight/prism:4@sha256:08dc16243047a3263beca814b544a5be81e9ec25ca5757cdc4170c84f7431355
    container_name: mock_external_api
    command: mock -h 0.0.0.0 /mocks/external_api.yaml
    volumes:
      - ./mocks/external_api.yaml:/mocks/external_api.yaml:ro
    ports:
      - "${PUBLISH_ADDRESS:-127.0.0.1}:4010:4010"
    networks:
      - control_net
    restart: unless-stopped

  nginx_proxy:
    image: openresty/openresty:1.29.2.1-alpine@sha256:711a9c269a6e4f4b5540fe6bdb4924bba14fc95ff16a77d6da76f89a78ad3e11
    container_name: nginx_proxy
    security_opt:
      - no-new-privileges:${NO_NEW_PRIVILEGES:-true}
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
      - DAC_READ_SEARCH
    tmpfs:
      - /tmp
      - /var/run
    read_only: true
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O- http://127.0.0.1/healthz >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - ./nginx/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ./nginx/render_cdn_origin_lockdown.sh:/usr/local/bin/render_cdn_origin_lockdown.sh:ro
      - ./nginx/lua:/etc/nginx/lua:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/sites-enabled:/etc/nginx/sites-enabled:ro
      - ./nginx/.htpasswd:/etc/nginx/secrets/.htpasswd:ro
      - ./waf:/etc/nginx/modsecurity:ro
      - ./docs_ui:/usr/share/nginx/html/docs_ui:ro
      - secrets_nginx:/run/secrets:ro
      - nginx_generated_conf:/etc/nginx/generated-conf
      # Restored Nginx cache volumes for stability and performance
      - nginx_client_body_temp:/var/run/openresty/nginx-client-body
      - nginx_proxy_temp:/var/cache/nginx/proxy_temp
      - nginx_fastcgi_temp:/var/cache/nginx/fastcgi_temp
      - nginx_uwsgi_temp:/var/cache/nginx/uwsgi_temp
      - nginx_scgi_temp:/var/cache/nginx/scgi_temp
      - nginx_logs:/var/log/nginx
    environment:
      - VERIFIED_CRAWLERS=${VERIFIED_CRAWLERS-googlebot,bingbot}
      - CRAWLER_DNS_NAMESERVER=${CRAWLER_DNS_NAMESERVER:-127.0.0.11}
      - LUA_PATH=/usr/local/openresty/lualib/?.lua;;
      - AI_SERVICE_HOST=ai_service
      - ESCALATION_ENGINE_HOST=escalation_engine
      - TARPIT_API_HOST=tarpit_api
      - ADMIN_UI_HOST=admin_ui
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PASSWORD_FILE=${REDIS_PASSWORD_FILE}
      - ENABLE_HTTPS=${ENABLE_HTTPS}
      - SECURITY_CDN_ORIGIN_LOCKDOWN=${SECURITY_CDN_ORIGIN_LOCKDOWN:-false}
      - SECURITY_CDN_TRUSTED_PROXY_CIDRS=${SECURITY_CDN_TRUSTED_PROXY_CIDRS:-}
      - REQUIRE_CLOUDFLARE_ACCOUNT=${REQUIRE_CLOUDFLARE_ACCOUNT:-false}
      - TLS_CERT_PATH=${TLS_CERT_PATH}
      - TLS_KEY_PATH=${TLS_KEY_PATH}
    command:
      - /bin/sh
      - -c
      - /bin/sh /usr/local/bin/render_cdn_origin_lockdown.sh && exec /usr/local/openresty/bin/openresty -g 'daemon off;'
    depends_on:
      secrets_init:
        condition: service_completed_successfully
      escalation_engine:
        condition: service_healthy
      tarpit_api:
        condition: service_healthy
      admin_ui:
        condition: service_healthy
    networks:
      - edge_net
      - data_net
    pids_limit: 256
    mem_limit: 512m
    restart: unless-stopped

  apache_proxy:
    image: httpd:2.4@sha256:32e9403360ab2f1047523e72f256527fb9aee68b342abf6ad03f0d629157f3d9
    container_name: apache_proxy
    ports:
      - "${PUBLISH_ADDRESS:-127.0.0.1}:${APACHE_HTTP_PORT:-8080}:80"
    volumes:
      - ./apache/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
    depends_on:
      escalation_engine:
        condition: service_healthy
      tarpit_api:
        condition: service_healthy
      admin_ui:
        condition: service_healthy
      ai_service:
        condition: service_healthy
    networks:
      - edge_net
      - data_net
    restart: unless-stopped

  ai_service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.14}
        RUST_VERSION: ${RUST_VERSION:-1.88}
        PYTHON_DIGEST: ${PYTHON_DIGEST:-sha256:9aaa474097d094040649f2162a627c0049b408f52138d980916788d80f04802f}
        RUST_DIGEST: ${RUST_DIGEST:-sha256:af306cfa71d987911a781c37b59d7d67d934f49684058f96cf72079c3626bfe0}
    container_name: ai_service
    environment:
      - ESCALATION_API_KEY_FILE=/run/secrets/escalation_api_key.txt
    command:
      [
        "uvicorn",
        "src.ai_service.ai_webhook:app",
        "--host",
        "0.0.0.0",
        "--port",
        "${AI_SERVICE_PORT:-8000}",
      ]
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs
      - ./scripts/linux/docker-entrypoint.sh:/app/docker-entrypoint.sh
      - secrets_ai_service:/run/secrets:ro
    depends_on:
      secrets_init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      escalation_engine:
        condition: service_started
    networks:
      - edge_net
      - data_net
    pids_limit: 256
    mem_limit: 512m
    restart: unless-stopped
    security_opt:
      - no-new-privileges:${NO_NEW_PRIVILEGES:-true}
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "-H",
          "X-Forwarded-Proto: https",
          "http://localhost:${AI_SERVICE_PORT:-8000}/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  escalation_engine:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.14}
        RUST_VERSION: ${RUST_VERSION:-1.88}
        PYTHON_DIGEST: ${PYTHON_DIGEST:-sha256:9aaa474097d094040649f2162a627c0049b408f52138d980916788d80f04802f}
        RUST_DIGEST: ${RUST_DIGEST:-sha256:af306cfa71d987911a781c37b59d7d67d934f49684058f96cf72079c3626bfe0}
    container_name: escalation_engine
    environment:
      - ESCALATION_API_KEY_FILE=/run/secrets/escalation_api_key.txt
      - CAPTCHA_SECRET_FILE=/run/secrets/captcha_secret.txt
      - AUTH_JWT_SECRET_FILE=/run/secrets/auth_jwt_secret.txt
    command:
      [
        "uvicorn",
        "src.escalation.escalation_engine:app",
        "--host",
        "0.0.0.0",
        "--port",
        "${ESCALATION_ENGINE_PORT:-8003}",
      ]
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./models:/app/models
      - ./data:/app/data
      - secrets_escalation:/run/secrets:ro
    depends_on:
      secrets_init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - edge_net
      - data_net
      - control_net
    pids_limit: 256
    mem_limit: 512m
    restart: unless-stopped
    security_opt:
      - no-new-privileges:${NO_NEW_PRIVILEGES:-true}
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sS -H 'X-Forwarded-Proto: https' http://localhost:${ESCALATION_ENGINE_PORT:-8003}/health | grep -Eq '\"status\":\"(ok|degraded)\"'",
