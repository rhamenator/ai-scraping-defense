      interval: 30s
      timeout: 10s
      retries: 3

  captcha_service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.14}
        RUST_VERSION: ${RUST_VERSION:-1.88}
        PYTHON_DIGEST: ${PYTHON_DIGEST:-sha256:9aaa474097d094040649f2162a627c0049b408f52138d980916788d80f04802f}
        RUST_DIGEST: ${RUST_DIGEST:-sha256:af306cfa71d987911a781c37b59d7d67d934f49684058f96cf72079c3626bfe0}
    container_name: captcha_service
    environment:
      - CAPTCHA_SECRET_FILE=/run/secrets/captcha_secret.txt
    command:
      [
        "uvicorn",
        "src.captcha.custom_captcha_service:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8004",
      ]
    env_file:
      - .env
    depends_on:
      secrets_init:
        condition: service_completed_successfully
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs
      - secrets_captcha:/run/secrets:ro
    networks:
      - edge_net
      - data_net
    pids_limit: 256
    mem_limit: 512m
    restart: unless-stopped
    security_opt:
      - no-new-privileges:${NO_NEW_PRIVILEGES:-true}
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
