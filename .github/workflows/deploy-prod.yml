---
name: Deploy to Production (GKE via Helm)
"on":
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Target environment"
        default: production
        type: choice
        options:
          - production
        required: false
      ref:
        description: "Git ref to run against"
        required: false
      version_tag:
        description: "Optional version tag (defaults to short SHA)"
        required: false
permissions:
  contents: read
concurrency:
  group: >-
    ${{ github.workflow }}-${{
    github.event.inputs.target_environment || github.ref }}
  cancel-in-progress: true
env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}
jobs:
  build-and-deploy:
    permissions:
      contents: read
      packages: write
      deployments: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Login GHCR
        run: >-
          echo "${{ secrets.GITHUB_TOKEN }}" |
          docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
      - name: Build & push images
        env:
          # Passed through the environment, never interpolated into the script (#1910).
          INPUT_VERSION_TAG: ${{ github.event.inputs.version_tag }}
          COMMIT_SHA: ${{ github.sha }}
          IMAGE_OWNER_NAME: ${{ github.repository_owner }}
        run: |
          set -eu
          TAG="${INPUT_VERSION_TAG:-$COMMIT_SHA}"
          # A container tag: 1-128 of [A-Za-z0-9_.-], not starting with . or -.
          if ! [[ "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::version_tag is not a valid container tag"
            exit 1
          fi
          TAG=${TAG:0:12}
          set -x
          declare -A svc_map=(
            [core]="."
            [proxy]="proxy"
            [cloud_proxy]="cloud-proxy"
            [prompt_router]="prompt-router"
          )
          : > images.txt
          for svc in "${!svc_map[@]}"; do
            dir="${svc_map[$svc]}"
            if [ -f "$dir/Dockerfile" ]; then
              image="$REGISTRY/${IMAGE_OWNER_NAME,,}/$svc:$TAG"
              docker build -t "$image" "$dir"
              docker push "$image"
              echo "$svc=$image" >> images.txt
            fi
          done
          cat images.txt
      # yamllint disable rule:line-length
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER:
            ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395  # v3.0.0
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          GKE_CLUSTER: ${{ secrets.GKE_CLUSTER }}
          GCP_REGION: ${{ secrets.GCP_REGION }}
        with:
          project_id: ${{ env.GCP_PROJECT }}
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GCP_REGION }}
      # yamllint enable rule:line-length
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e
      - name: Helm upgrade/install (production)
        run: |
          set -eux
          CHART="helm/ai-scraping-defense-v9"
          OV=/tmp/values-images.yaml
          echo "images:" > "$OV"
          while IFS='=' read -r svc img; do
            echo "  $svc: \"$img\"" >> "$OV"
          done < images.txt
          helm upgrade --install ai-scraping-defense "$CHART" \
            -n production --create-namespace \
            -f helm/values-production.yaml -f "$OV"
      - name: Wait for rollout
        run: |
          kubectl -n production rollout status deploy --timeout=600s || true
          kubectl -n production get pods -o wide
