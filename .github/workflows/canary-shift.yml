name: Canary Shift
on:
  workflow_dispatch:
    inputs:
      weight: { description: "Canary weight (whole number, 0-100)", required: true, type: number }
permissions:
  contents: read
concurrency:
  group: canary-shift-production
  cancel-in-progress: false
jobs:
  shift:
    # The production environment holds the cloud secrets and requires reviewer approval before this job can start.
    environment: production
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    env:
      # Fixed on purpose: the canary shift only ever touches this ingress in this namespace.
      CANARY_NAMESPACE: production
      CANARY_INGRESS: ai-scraping-defense-canary
      CANARY_WEIGHT: ${{ inputs.weight }}
    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail
          if ! [[ "${CANARY_WEIGHT}" =~ ^[0-9]+$ ]] || (( CANARY_WEIGHT > 100 )); then
            echo "weight must be a whole number from 0 to 100" >&2
            exit 1
          fi
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395 # v3.0.0
        with:
          project_id: ${{ secrets.GCP_PROJECT }}
          cluster_name: ${{ secrets.GKE_CLUSTER }}
          location: ${{ secrets.GCP_REGION }}
      - name: Set weight
        run: |
          set -euo pipefail
          kubectl -n "${CANARY_NAMESPACE}" annotate ingress "${CANARY_INGRESS}" \
            nginx.ingress.kubernetes.io/canary="true" \
            nginx.ingress.kubernetes.io/canary-weight="${CANARY_WEIGHT}" --overwrite
          kubectl -n "${CANARY_NAMESPACE}" get ingress "${CANARY_INGRESS}" -o yaml
