name: release-bundles

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Derive Release Bundle Metadata
        id: refs
        shell: bash
        run: |
          set -euo pipefail

          ref_name="${GITHUB_REF_NAME}"
          version="${ref_name#v}"
          prerelease="false"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must follow v<semver>; received '$ref_name'." >&2
            exit 1
          fi

          if [[ "$version" == *-* ]]; then
            prerelease="true"
          fi

          prefix="ai-scraping-defense-${version}"
          zip_name="${prefix}-bundle.zip"
          tar_name="${prefix}-bundle.tar.gz"

          {
            echo "version=${version}"
            echo "prerelease=${prerelease}"
            echo "prefix=${prefix}"
            echo "zip_name=${zip_name}"
            echo "tar_name=${tar_name}"
          } >> "$GITHUB_OUTPUT"

      - name: Build Release Bundles
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts/release-bundles

          prefix="${{ steps.refs.outputs.prefix }}/"
          zip_path="artifacts/release-bundles/${{ steps.refs.outputs.zip_name }}"
          tar_path="artifacts/release-bundles/${{ steps.refs.outputs.tar_name }}"

          git archive \
            --format=zip \
            --prefix="$prefix" \
            --output="$zip_path" \
            "$GITHUB_SHA"

          git archive \
            --format=tar \
            --prefix="$prefix" \
            "$GITHUB_SHA" | gzip -n > "$tar_path"

      - name: Generate Bundle Checksums
        shell: bash
        run: |
          set -euo pipefail

          cd artifacts/release-bundles
          for artifact in *.zip *.tar.gz; do
            sha256sum "$artifact" | awk '{ print tolower($1) " *" $2 }' > "$artifact.sha256"
          done

      - name: Build Python Packages
        shell: bash
        run: |
          set -euo pipefail

          package_version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "$package_version" != "${{ steps.refs.outputs.version }}" ]]; then
            echo "pyproject.toml version '$package_version' does not match tag version '${{ steps.refs.outputs.version }}'." >&2
            exit 1
          fi

          python3 -m pip install --disable-pip-version-check build twine
          python3 -m build --outdir artifacts/python-dist
          python3 -m twine check artifacts/python-dist/*

          cd artifacts/python-dist
          for artifact in *.whl *.tar.gz; do
            sha256sum "$artifact" | awk '{ print tolower($1) " *" $2 }' > "$artifact.sha256"
          done

      - name: Smoke Test Python Package Installation
        shell: bash
        run: |
          set -euo pipefail

          wheel="$(find "$GITHUB_WORKSPACE/artifacts/python-dist" -maxdepth 1 -name '*.whl' -print -quit)"
          sdist="$(find "$GITHUB_WORKSPACE/artifacts/python-dist" -maxdepth 1 -name '*.tar.gz' -print -quit)"

          python3 -m venv /tmp/asd-wheel-smoke
          /tmp/asd-wheel-smoke/bin/python -m pip install --disable-pip-version-check "$wheel"
          /tmp/asd-wheel-smoke/bin/python -m pip check
          cd /tmp
          /tmp/asd-wheel-smoke/bin/python -c 'from importlib.metadata import version; import src.pay_per_crawl.proxy; assert version("ai-scraping-defense") == "${{ steps.refs.outputs.version }}"'

          python3 -m venv /tmp/asd-sdist-smoke
          /tmp/asd-sdist-smoke/bin/python -m pip install --disable-pip-version-check --no-deps "$sdist"
          cd /tmp
          /tmp/asd-sdist-smoke/bin/python -c 'from importlib.metadata import version; assert version("ai-scraping-defense") == "${{ steps.refs.outputs.version }}"'

      - name: Write Release Notes Fragment
        shell: bash
        run: |
          set -euo pipefail

          cat > artifacts/release-bundles/release-notes-fragment.md <<EOF
          <!-- release-bundles:start -->
          Installer bundles for ${GITHUB_REF_NAME}

          Download guidance:

          - Windows: ${{ steps.refs.outputs.zip_name }}
          - Linux: ${{ steps.refs.outputs.tar_name }}
          - macOS: ${{ steps.refs.outputs.tar_name }}

          Python packages:

          - wheel and source distribution files are attached for pip-based installations

          Verify the matching .sha256 file before running the extracted installer entrypoint.
          <!-- release-bundles:end -->
          EOF

      - name: Ensure Release Exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$GITHUB_REF_NAME" --json body --jq .body > artifacts/release-bundles/release-notes-existing.md 2>/dev/null; then
            python3 scripts/merge_release_notes.py \
              artifacts/release-bundles/release-notes-existing.md \
              artifacts/release-bundles/release-notes-fragment.md \
              artifacts/release-bundles/release-notes.md

            edit_args=(
              "$GITHUB_REF_NAME"
              --notes-file artifacts/release-bundles/release-notes.md
            )
            if [[ "${{ steps.refs.outputs.prerelease }}" == "true" ]]; then
              edit_args+=(--prerelease)
            else
              edit_args+=(--latest)
            fi
            gh release edit "${edit_args[@]}"
          else
            create_args=(
              "$GITHUB_REF_NAME"
              --title "$GITHUB_REF_NAME"
              --notes-file artifacts/release-bundles/release-notes-fragment.md
            )
            if [[ "${{ steps.refs.outputs.prerelease }}" == "true" ]]; then
              create_args+=(--prerelease)
            fi
            gh release create "${create_args[@]}"
          fi

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: release-bundles
          path: |
            artifacts/release-bundles/*.zip
            artifacts/release-bundles/*.tar.gz
            artifacts/release-bundles/*.sha256
            artifacts/release-bundles/release-notes-fragment.md
            artifacts/release-bundles/release-notes.md
            artifacts/python-dist/*.whl
            artifacts/python-dist/*.tar.gz
            artifacts/python-dist/*.sha256

      - name: Upload Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          gh release upload "$GITHUB_REF_NAME" \
            artifacts/release-bundles/*.zip \
            artifacts/release-bundles/*.tar.gz \
            artifacts/release-bundles/*.sha256 \
            artifacts/python-dist/*.whl \
            artifacts/python-dist/*.tar.gz \
            artifacts/python-dist/*.sha256 \
            --clobber

      - name: Summarize Release Bundles
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "Published installer bundles:"
            echo ""
            for artifact in artifacts/release-bundles/*; do
              echo "- \`$(basename "$artifact")\`"
            done
            for artifact in artifacts/python-dist/*; do
              echo "- \`$(basename "$artifact")\`"
            done
            echo ""
            echo "Use the .zip bundle on Windows and the .tar.gz bundle on Linux or macOS."
          } >> "$GITHUB_STEP_SUMMARY"
