# Copy to a secret-managed manifest and replace the placeholder. Do not commit
# the real key. Both tarpit-api and escalation-engine must receive the same key.
apiVersion: v1
kind: Secret
metadata:
  name: tls-fingerprint-attestation
  namespace: ai-defense
type: Opaque
stringData:
  TLS_FINGERPRINT_ATTESTATION_KEY: replace-with-at-least-32-random-bytes
  # Set only during a rolling rotation, then remove after the grace period.
  TLS_FINGERPRINT_ATTESTATION_PREVIOUS_KEY: ""
