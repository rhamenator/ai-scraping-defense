# Example only (not applied by `kubectl apply -f kubernetes/`): put HTTPS in front of the nginx-proxy Service (#1915).
# The raw manifests serve plain HTTP on port 80 inside the cluster, so terminate TLS here (or at your cloud load balancer)
# and redirect HTTP to HTTPS. Replace the host and the secret name. With cert-manager, uncomment the issuer annotation and
# the certificate is requested and renewed for you; otherwise create the secret yourself:
#   kubectl -n ai-defense create secret tls asd-tls --cert=fullchain.pem --key=privkey.pem
# Then change the nginx-proxy Service to `type: ClusterIP` so the only public entry is this HTTPS ingress.
#
# Use whichever ingress controller you run: set ingressClassName to its class. The HTTP->HTTPS redirect is configured
# differently by each controller; the commented annotations below are the ones for ingress-nginx (note that the
# Kubernetes ingress-nginx project has been retired, so prefer a maintained controller or the Gateway API).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-proxy
  namespace: ai-defense
  annotations:
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: my-ingress-class
  tls:
    - secretName: asd-tls
      hosts:
        - defense.example.com
  rules:
    - host: defense.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx-proxy
                port:
                  number: 80
