# kubernetes/waf-rules-fetcher-cronjob.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: owasp-crs-fetcher
  namespace: ai-defense
spec:
  # The stock OpenResty image is not ModSecurity-enabled. Keep this maintenance
  # job suspended until the Nginx deployment uses a ModSecurity-capable image
  # and the shared rules volume is in place: follow
  # kubernetes/optional-waf-crs/README.md, then set `suspend: false`.
  suspend: true
  # Runs daily at 3 AM.
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: waf-rules-updater-sa
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: owasp-crs-fetcher
            # This image must include the Kubernetes client for WAF_RELOAD_MODE=kubernetes (see
            # kubernetes/optional-waf-crs/README.md: the standard image does not).
            image: your-registry/ai-scraping-defense:latest
            imagePullPolicy: Always
            command: ["python", "-m", "src.util.rules_fetcher"]
            resources:
              requests:
                cpu: "100m"
                memory: "128Mi"
              limits:
                cpu: "500m"
                memory: "512Mi"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            env:
            # Final download URL (no redirects are followed) and the SHA-256 of that exact archive. To move to a new
            # release, change both together (see kubernetes/optional-waf-crs/README.md for how to compute the digest).
            - name: CRS_DOWNLOAD_URL
              value: "https://codeload.github.com/coreruleset/coreruleset/tar.gz/refs/tags/v4.30.0"
            - name: CRS_SHA256
              value: "a4bb3688ef6205b64471a9ccbf0d7b024eb8edf39b97c6f6c0006e7a948f8550"
            - name: RULES_ALLOWED_DOMAINS
              value: "codeload.github.com"
            - name: RULES_REQUIRE_DIGEST
              value: "true"
            # The rules go onto the shared volume that the Nginx pods also mount (kubernetes/optional-waf-crs/).
            - name: MODSECURITY_DIR
              value: "/waf"
            # This container has no Nginx to signal, so ask Kubernetes to roll the Nginx Deployment instead.
            - name: WAF_RELOAD_MODE
              value: "kubernetes"
            - name: WAF_RESTART_DEPLOYMENT
              value: "nginx-proxy"
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: waf-rules
              mountPath: /waf
          volumes:
          - name: tmp
            emptyDir: {}
          - name: waf-rules
            persistentVolumeClaim:
              claimName: waf-rules
          restartPolicy: OnFailure
