apiVersion: v1
kind: Service
metadata:
  name: nginx-proxy
  namespace: ai-defense
spec:
  selector:
    app: nginx-proxy
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
  type: LoadBalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-proxy
  namespace: ai-defense
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-proxy
  template:
    metadata:
      labels:
        app: nginx-proxy
    spec:
      containers:
      - name: nginx
        image: openresty/openresty:1.29.2.1-alpine
        imagePullPolicy: Always
        command:
        - /bin/sh
        - -c
        - /bin/sh /usr/local/bin/render-runtime-config.sh && exec /usr/local/openresty/bin/openresty -g 'daemon off;'
        envFrom:
        - configMapRef:
            name: app-config
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        readinessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d
          readOnly: true
        - name: nginx-renderer
          mountPath: /usr/local/bin/render-runtime-config.sh
          subPath: render-runtime-config.sh
          readOnly: true
        - name: generated-config
          mountPath: /etc/nginx/generated-conf
        - name: robots-txt
          mountPath: /etc/nginx/robots.txt
          subPath: robots.txt
          readOnly: true
        - name: nginx-logs
          mountPath: /var/log/nginx
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-runtime-config
          items:
          - key: default.conf
            path: default.conf
      - name: nginx-renderer
        configMap:
          name: nginx-runtime-config
          defaultMode: 0555
          items:
          - key: render-runtime-config.sh
            path: render-runtime-config.sh
      - name: generated-config
        emptyDir: {}
      - name: robots-txt
        configMap:
          name: live-robots-txt-config
          items:
          - key: robots.txt
            path: robots.txt
      - name: nginx-logs
        persistentVolumeClaim:
          claimName: nginx-logs-pvc
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nginx-hpa
  namespace: ai-defense
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nginx-proxy
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
