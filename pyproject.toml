[build-system]
requires = ["setuptools>=83.0.0", "wheel>=0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-scraping-defense"
version = "0.0.7"
description = "Multi-layered defense services for AI-powered scraping and malicious bots"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
  { name = "Richard M. Hamilton" },
]
dynamic = ["dependencies"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/rhamenator/ai-scraping-defense"
Documentation = "https://github.com/rhamenator/ai-scraping-defense/tree/main/docs"
Issues = "https://github.com/rhamenator/ai-scraping-defense/issues"
Source = "https://github.com/rhamenator/ai-scraping-defense"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements-runtime.txt"] }

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = true

[tool.setuptools.package-data]
"src.admin_ui" = ["static/*", "templates/*"]
"src.tarpit" = ["README.md"]
