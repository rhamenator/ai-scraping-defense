global:
  registry: ghcr.io
  pullPolicy: IfNotPresent

images:
  core: ""
  proxy: ""
  cloud_proxy: ""
  prompt_router: ""

ingress:
  enabled: true
  className: nginx
  # With cert-manager, name your issuer so the certificate for the secret below is requested and renewed for you:
  #   cert-manager.io/cluster-issuer: letsencrypt-prod
  # Without it, create the TLS secret yourself (kubectl create secret tls asd-prod-tls --cert=... --key=...).
  annotations: {}
  # Refuse to render without TLS for every host (#1915). Replace the host below, keep this on.
  requireTLS: true
  hosts:
    - host: prod-yourdomain.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: asd-prod-tls
      hosts:
        - prod-yourdomain.example.com

vault:
  enabled: true
  address: https://vault.production.internal:8200
  authMethod: kubernetes
  role: ai-defense-production
  secretPath: secret/data/ai-defense/production
  verifyTLS: true

services:
  core:
    enabled: true
    replicas: 3
    image: "{{ .Values.images.core }}"
    resources:
      requests: { cpu: "200m", memory: "256Mi" }
      limits:   { cpu: "1",   memory: "512Mi" }
  proxy:
    enabled: true
    replicas: 3
    image: "{{ .Values.images.proxy }}"
    resources:
      requests: { cpu: "200m", memory: "256Mi" }
      limits:   { cpu: "1",   memory: "512Mi" }
  cloud_proxy:
    enabled: false
    replicas: 2
    image: "{{ .Values.images.cloud_proxy }}"
  prompt_router:
    enabled: false
    replicas: 2
    image: "{{ .Values.images.prompt_router }}"
